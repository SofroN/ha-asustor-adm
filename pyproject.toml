[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-asustor-adm"
version = "0.2.0"
description = "Home Assistant integration for ASUSTOR NAS (ADM)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501", "RUF012", "RUF001", "RUF002", "RUF003", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.setuptools]
packages = ["custom_components.asustor_adm"]

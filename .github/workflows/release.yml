name: Release

# Выпуск версии: тег и релиз с архивом плагина и списком изменений.
#
# Триггеры:
#  * push в main — если в VERSION приехал больший номер, выпуск происходит
#    автоматически. Решение принимает scripts/bump_version.py: версия не
#    больше последнего тега или тег уже стоит — работа завершается без
#    действий. Исключение — тег есть, а релиза нет: прошлый запуск упал на
#    загрузке архива, такой релиз доводится до конца.
#  * workflow_dispatch — ручной выпуск: level/version обновляют файлы версии
#    и CHANGELOG, current публикует уже подготовленную версию.
#
# Релиз собирается атомарно: черновик, загрузка архива, публикация
# (scripts/publish_release.py). Пока архив не загружен, релиз остаётся
# черновиком и не виден пользователям и HACS.
#
# Метка раннера, как и в ci.yml, берётся из переменной CI_RUNNER: на Forgejo
# это self-hosted `main`, на GitHub переменная не задана и подставляется
# стандартный `ubuntu-latest`.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      level:
        description: "Что выпускаем: current — версию из VERSION, иначе инкремент"
        type: choice
        options: [current, patch, minor, major]
        default: current
      version:
        description: "Явная версия X.Y.Z (приоритетнее level); пусто — не задана"
        type: string
        default: ""
      dry_run:
        description: "Только показать, что будет выпущено"
        type: boolean
        default: false

permissions:
  contents: write

# Два пуша подряд не должны выпускать релизы параллельно: иначе оба job
# увидят один и тот же последний тег и попытаются создать один релиз.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: версия, тег и релиз
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      # JS-действия требуют node на хосте: на self-hosted его может не быть.
      - name: Подготовить node
        run: |
          set -eo pipefail
          if command -v node >/dev/null 2>&1; then
            echo "node уже установлен: $(node -v)"
            exit 0
          fi
          echo "node не найден, устанавливаю из репозитория Debian"
          apt() { if [ "$(id -u)" -eq 0 ]; then apt-get "$@"; else sudo apt-get "$@"; fi; }
          export DEBIAN_FRONTEND=noninteractive
          apt update -qq
          apt install -y -qq --no-install-recommends nodejs
          node -v

      # Глубина 0 нужна дважды: теги для решения о выпуске и история для
      # списка изменений с прошлого релиза.
      - name: Получить исходники
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Python на self-hosted раннере не гарантирован — берём его через uv,
      # как и в CI.
      - name: Установить uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Настроить git
        run: |
          set -eo pipefail
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.local"

      - name: Определить версию
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_LEVEL: ${{ inputs.level }}
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eo pipefail
          py() { uv run --no-project python "$@"; }
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            args=()
            if [ -n "$INPUT_VERSION" ]; then
              args+=(--version "$INPUT_VERSION")
            elif [ "$INPUT_LEVEL" != "current" ]; then
              args+=(--level "$INPUT_LEVEL")
            fi
            if [ "$DRY_RUN" = "true" ]; then
              args+=(--dry-run)
            fi
            version=$(py scripts/bump_version.py "${args[@]}")
          else
            # В push-режиме номер версии готовит автор изменения: скрипт
            # приводит к нему производные manifest.json и pyproject.toml
            # и ничего не меняет, если они уже совпадают.
            version=$(py scripts/bump_version.py --sync)
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" != "true" ]; then
            # Ручной выпуск требует описанных изменений: пустой раздел
            # CHANGELOG не должен превращаться в релиз без описания.
            py scripts/bump_version.py --notes "$version" > /dev/null
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "определена версия $version"

      - name: Решить, нужен ли выпуск
        id: state
        if: ${{ inputs.dry_run != true }}
        env:
          # Стандартные имена Actions: их же читает scripts/publish_release.py,
          # поэтому локальный запуск повторяет поведение CI.
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -eo pipefail
          py() { uv run --no-project python "$@"; }
          state=$(py scripts/bump_version.py --state)
          echo "$state"
          field() {
            printf '%s' "$state" | py -c "import json, sys; print(json.load(sys.stdin)[\"$1\"] or '')"
          }
          tag=$(field tag)
          release=$(printf '%s' "$state" | py -c \
            'import json, sys; print("true" if json.load(sys.stdin)["should_release"] else "false")')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [ "$release" = "true" ]; then
            echo "версия $tag выпускается: нужен тег"
          else
            echo "тег $tag уже стоит: публикация догонит недостающий релиз"
          fi

      - name: Показать план выпуска
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eo pipefail
          echo "был бы выпущен релиз v$VERSION"
          echo "ассет: asustor_adm-$VERSION.zip (распаковка в /config)"
          echo "текст: раздел CHANGELOG версии, коммиты от прошлого тега, ссылка сравнения"

      # Тег, который уже указывает на текущий коммит, не пересоздаётся:
      # повторный запуск добавляет только недостающее.
      - name: Закоммитить и пометить тегом
        if: steps.state.outputs.release == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
          TAG: ${{ steps.state.outputs.tag }}
        run: |
          set -eo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "файлы версии не изменились, коммит не нужен"
          else
            git commit -m "chore(release): $TAG"
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "тег $TAG уже существует"
          else
            git tag -a "$TAG" -m "$TAG"
          fi
          git push origin "HEAD:$BRANCH" --follow-tags

      - name: Собрать архив плагина
        if: ${{ inputs.dry_run != true }}
        id: archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eo pipefail
          asset=$(uv run --no-project python scripts/build_plugin_zip.py \
            --version "$VERSION")
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          ls -l "$asset"

      - name: Собрать текст релиза
        if: ${{ inputs.dry_run != true }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eo pipefail
          uv run --no-project python scripts/bump_version.py \
            --release-body "$VERSION" > "${RUNNER_TEMP:-/tmp}/notes.md"
          cat "${RUNNER_TEMP:-/tmp}/notes.md"

      - name: Опубликовать релиз
        if: ${{ inputs.dry_run != true }}
        env:
          # Стандартные имена Actions: их же читает scripts/publish_release.py,
          # поэтому локальный запуск повторяет поведение CI.
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_ENGINE: ${{ vars.RELEASE_ENGINE }}
          TAG: ${{ steps.state.outputs.tag }}
          ASSET: ${{ steps.archive.outputs.asset }}
        run: |
          set -eo pipefail
          args=(
            --tag "$TAG"
            --asset "$ASSET"
            --notes-file "${RUNNER_TEMP:-/tmp}/notes.md"
          )
          if [ -n "$RELEASE_ENGINE" ]; then
            args+=(--engine "$RELEASE_ENGINE")
          fi
          uv run --no-project python scripts/publish_release.py "${args[@]}"

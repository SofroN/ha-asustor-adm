name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_suite:
        description: "Полный набор тестов (скачает Home Assistant, ~500 МБ)"
        type: boolean
        default: false

jobs:
  fast:
    name: lint и быстрые тесты
    runs-on: main
    steps:
      - name: Проверить node и установить при отсутствии
        run: |
          set -eo pipefail
          if command -v node >/dev/null 2>&1; then
            echo "node уже установлен: $(node -v)"
            exit 0
          fi
          echo "node не найден, устанавливаю из репозитория Debian"
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends nodejs
          node -v

      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Проверить линт и формат
        run: |
          set -eo pipefail
          uvx ruff check .
          uvx ruff format --check .

      - name: Быстрые тесты без Home Assistant
        run: |
          set -eo pipefail
          uv run --no-project \
            --with pytest --with pytest-asyncio --with pytest-aiohttp --with aiohttp \
            python -m pytest tests/unit -q --confcutdir=tests/unit -p no:cacheprovider

  full:
    name: полный набор тестов
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite }}
    runs-on: main
    steps:
      - name: Проверить node и установить при отсутствии
        run: |
          set -eo pipefail
          if command -v node >/dev/null 2>&1; then
            echo "node уже установлен: $(node -v)"
            exit 0
          fi
          echo "node не найден, устанавливаю из репозитория Debian"
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends nodejs
          node -v

      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Прогнать полный набор
        run: |
          set -eo pipefail
          uv venv .venv --python 3.13
          uv pip install --python .venv/bin/python -r requirements_test.txt
          .venv/bin/python -m pytest -q -p no:cacheprovider
